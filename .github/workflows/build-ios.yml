name: Build iOS (Tauri)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Tauri CLI
        run: |
          npm ci
          npm install --save-dev @tauri-apps/cli@next

      # Cài đặt công cụ iOS bắt buộc
      - name: Install iOS build tools (xcodegen & cocoapods)
        run: |
          arch -arm64 brew install xcodegen cocoapods jq

      # Khởi tạo Tauri project và cập nhật bundle identifier hợp lệ
      - name: Initialize Tauri & iOS
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: |
          if [ ! -d "src-tauri" ]; then
            npx tauri init \
              --app-name "ProjectFood" \
              --window-title "Project Food" \
              --frontend-dist "http://221.132.21.152:3000" \
              --dev-url "http://221.132.21.152:3000" \
              --ci
          fi

          # Đổi bundle identifier từ com.tauri.dev sang com.projectfood.app
          if [ -f "src-tauri/tauri.conf.json" ]; then
            jq '.identifier = "com.projectfood.app"' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          fi

          if [ ! -d "src-tauri/gen/apple" ]; then
            npx tauri ios init
          fi

      # Cache các thư viện Rust
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Cho phép kết nối HTTP trên iOS
      - name: Allow HTTP in iOS Info.plist
        run: |
          for plist in src-tauri/gen/apple/*/Info.plist; do
            if [ -f "$plist" ]; then
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$plist"
            fi
          done

      # Build ứng dụng cho iOS Simulator
      - name: Build iOS project
        run: |
          npx tauri ios build --target aarch64-sim

      # Lưu file build vào Artifacts
      - name: Upload iOS Xcode Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-output
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
