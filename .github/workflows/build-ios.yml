name: Build iOS (Tauri)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90

    env:
      CI: true
      APPLE_DEVELOPMENT_TEAM: "0000000000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        shell: bash
        run: |
          set -euxo pipefail

          XCODE_PATH=""
          for p in \
            /Applications/Xcode_16.1.app/Contents/Developer \
            /Applications/Xcode_16.0.app/Contents/Developer \
            /Applications/Xcode_16.app/Contents/Developer; do
            if [ -d "$p" ]; then
              XCODE_PATH="$p"
              break
            fi
          done

          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 16 not found on runner" >&2
            ls /Applications || true
            exit 1
          fi

          sudo xcode-select -switch "$XCODE_PATH"
          xcodebuild -version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Homebrew + iOS build tools
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          if [ -x /opt/homebrew/bin/brew ]; then
            eval "$(/opt/homebrew/bin/brew shell-env)"
          elif [ -x /usr/local/bin/brew ]; then
            eval "$(/usr/local/bin/brew shell-env)"
          fi

          brew install --quiet xcodegen cocoapods jq

      - name: Install app dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm ci
          npm install --save-dev @tauri-apps/cli@latest

      - name: Validate Tauri project exists
        shell: bash
        run: |
          set -euxo pipefail

          test -f package.json
          test -f src-tauri/Cargo.toml
          test -f src-tauri/tauri.conf.json

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Initialize iOS project
        shell: bash
        run: |
          set -euxo pipefail
          npx tauri ios init --ci || true

      - name: Allow HTTP in iOS Info.plist
        shell: bash
        run: |
          set -euxo pipefail
          shopt -s nullglob

          for plist in src-tauri/gen/apple/*/Info.plist; do
            echo "Patching $plist"

            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$plist" 2>/dev/null || true

            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains dict" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:221.132.21.152 dict" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:221.132.21.152:NSExceptionAllowsInsecureHTTPLoads bool true" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSExceptionDomains:221.132.21.152:NSExceptionAllowsInsecureHTTPLoads true" "$plist" 2>/dev/null || true
          done

      - name: Build iOS simulator app
        shell: bash
        run: |
          set -euxo pipefail
          npx tauri ios build --target aarch64-apple-ios-sim

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-output
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
