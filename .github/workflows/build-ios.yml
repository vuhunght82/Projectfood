name: Build iOS (Tauri)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Tauri CLI
        run: |
          npm ci
          npm install --save-dev @tauri-apps/cli@next

      # Cài đặt công cụ iOS bắt buộc
      - name: Install iOS build tools (xcodegen & cocoapods)
        run: |
          arch -arm64 brew install xcodegen cocoapods jq

      # Khởi tạo toàn bộ cấu hình Tauri chuẩn và triệt tiêu beforeBuildCommand
      - name: Setup Tauri Project & Config
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: |
          mkdir -p src-tauri

          # Tạo file tauri.conf.json chuẩn chỉnh không có beforeBuildCommand
          cat << 'EOF' > src-tauri/tauri.conf.json
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "ProjectFood",
            "version": "1.0.0",
            "identifier": "com.projectfood.restaurant",
            "build": {
              "frontendDist": "http://221.132.21.152:3000",
              "devUrl": "http://221.132.21.152:3000"
            },
            "app": {
              "withGlobalTauri": true,
              "windows": [
                {
                  "title": "Project Food",
                  "width": 800,
                  "height": 600
                }
              ],
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": true,
              "targets": "all"
            }
          }
          EOF

          # Khởi tạo Cargo.toml và main.rs nếu chưa có
          if [ ! -f "src-tauri/Cargo.toml" ]; then
            cat << 'EOF' > src-tauri/Cargo.toml
          [package]
          name = "project-food"
          version = "0.1.0"
          description = "Project Food App"
          authors = ["you"]
          edition = "2021"

          [lib]
          name = "project_food_lib"
          crate-type = ["staticlib", "cdylib", "rlib"]

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          EOF

            cat << 'EOF' > src-tauri/build.rs
          fn main() {
              tauri_build::build()
          }
          EOF

            mkdir -p src-tauri/src
            cat << 'EOF' > src-tauri/src/lib.rs
          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("error while running tauri application");
          }
          EOF

            cat << 'EOF' > src-tauri/src/main.rs
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          fn main() {
              project_food_lib::run();
          }
          EOF
          fi

          # Khởi tạo Xcode project cho iOS
          if [ ! -d "src-tauri/gen/apple" ]; then
            npx tauri ios init
          fi

      # Cache các thư viện Rust
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Cấu hình Info.plist cho phép HTTP không mã hóa
      - name: Allow HTTP in iOS Info.plist
        run: |
          for plist in src-tauri/gen/apple/*/Info.plist; do
            if [ -f "$plist" ]; then
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$plist"
            fi
          done

      # Build ứng dụng cho iOS Simulator
      - name: Build iOS project
        run: |
          npx tauri ios build --target aarch64-sim

      # Lưu file build vào Artifacts
      - name: Upload iOS Xcode Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-output
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
