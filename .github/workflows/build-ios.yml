name: Build iOS (Tauri)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cài đặt trước xcodegen và cocoapods để Tauri không tự gọi brew bị lỗi Rosetta
      - name: Install iOS build tools (xcodegen & cocoapods)
        run: |
          arch -arm64 brew install xcodegen cocoapods

      # Cài tauri-cli dạng binary
      - name: Install Tauri CLI
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0.0" --no-confirm

      # Khởi tạo Tauri project trỏ về IP máy chủ của bạn
      - name: Initialize Tauri & iOS
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: |
          if [ ! -d "src-tauri" ]; then
            cargo tauri init \
              --app-name "ProjectFood" \
              --window-title "Project Food" \
              --frontend-dist "http://221.132.21.152:3000" \
              --dev-url "http://221.132.21.152:3000" \
              --ci
          fi
          if [ ! -d "src-tauri/gen/apple" ]; then
            cargo tauri ios init
          fi

      # Cho phép kết nối HTTP qua mạng không bảo mật trên iOS
      - name: Allow HTTP in iOS Info.plist
        run: |
          for plist in src-tauri/gen/apple/*/Info.plist; do
            if [ -f "$plist" ]; then
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$plist"
            fi
          done

      # Build ứng dụng iOS
      - name: Build iOS project
        run: |
          cargo tauri ios build --target aarch64-apple-ios-sim

      - name: Upload iOS Xcode Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-output
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
