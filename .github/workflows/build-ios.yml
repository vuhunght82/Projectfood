name: Build iOS ARM64 App (Tauri v2)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Select Xcode 16
        run: |
          XCODE16=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          echo "Using Xcode: $XCODE16"
          sudo xcode-select -s "$XCODE16/Contents/Developer"
          xcodebuild -version

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 4. Setup Rust Toolchain (ARM64 iOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: 5. Install iOS Build Tools
        run: |
          arch -arm64 brew install xcodegen cocoapods ldid jq

      - name: 6. Inject "tauri" script into package.json & Install CLI
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.scripts = pkg.scripts || {};
            pkg.scripts["tauri"] = "tauri";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --no-audit --no-fund
          npm install --save-dev @tauri-apps/cli@^2.0.0 --no-audit --no-fund

      - name: 7. Generate Complete Tauri v2 Project (src-tauri)
        run: |
          rm -rf src-tauri
          mkdir -p src-tauri/src src-tauri/icons

          cat << 'EOF' > src-tauri/tauri.conf.json
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "ProjectFood",
            "version": "1.0.0",
            "identifier": "com.hoasen.projectfood",
            "build": {
              "frontendDist": "http://221.132.21.152:3000",
              "devUrl": "http://221.132.21.152:3000",
              "beforeDevCommand": "",
              "beforeBuildCommand": ""
            },
            "app": {
              "withGlobalTauri": true,
              "windows": [
                {
                  "title": "Project Food",
                  "width": 1024,
                  "height": 768
                }
              ],
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": true,
              "targets": "all",
              "icon": [
                "icons/icon.png"
              ],
              "iOS": {
                "developmentTeam": "0000000000"
              }
            }
          }
          EOF

          cat << 'EOF' > src-tauri/Cargo.toml
          [package]
          name = "project-food"
          version = "1.0.0"
          edition = "2021"

          [lib]
          name = "project_food_lib"
          crate-type = ["staticlib", "cdylib", "rlib"]

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          EOF

          cat << 'EOF' > src-tauri/build.rs
          fn main() {
              tauri_build::build()
          }
          EOF

          cat << 'EOF' > src-tauri/src/lib.rs
          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("error while running tauri application");
          }
          EOF

          cat << 'EOF' > src-tauri/src/main.rs
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]
          fn main() {
              project_food_lib::run();
          }
          EOF

          python3 -c '
          import struct, zlib
          def make_png(w, h):
              raw = b"".join(b"\x00" + b"\x2e\x7d\x32\xff" * w for _ in range(h))
              def chunk(t, d):
                  return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("src-tauri/icons/app-icon.png", "wb").write(make_png(1024, 1024))
          '
          npx tauri icon src-tauri/icons/app-icon.png

      - name: 8. Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 9. Initialize iOS Xcode Project
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: |
          npx tauri ios init

      - name: 10. Configure Info.plist (Allow HTTP to 221.132.21.152:3000)
        run: |
          for plist in src-tauri/gen/apple/*/Info.plist; do
            if [ -f "$plist" ]; then
              /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
            fi
          done

      - name: 11. Build ARM64 .app via Tauri CLI (Unsigned Wrapper)
        run: |
          # Tạo wrapper cho xcodebuild để tự động chèn cờ bỏ qua Code Signing khi Tauri CLI gọi xcodebuild
          mkdir -p "$RUNNER_TEMP/bin"
          cat << 'EOF' > "$RUNNER_TEMP/bin/xcodebuild"
          #!/bin/bash
          REAL_XCODEBUILD="/usr/bin/xcodebuild"
          # Nếu lệnh là archive hoặc build cho iphoneos thì chèn cờ tắt yêu cầu chứng chỉ Apple
          if [[ "$*" == *"-sdk iphoneos"* ]] || [[ "$*" == *"archive"* ]] || [[ "$*" == *"build"* ]]; then
            exec "$REAL_XCODEBUILD" "$@" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            exec "$REAL_XCODEBUILD" "$@"
          fi
          EOF
          chmod +x "$RUNNER_TEMP/bin/xcodebuild"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          # Chạy lệnh chính thức của Tauri CLI cho kiến trúc thiết bị thật ARM64 (aarch64)
          # Nhờ chạy qua Tauri CLI, file .tauri/cli-options-server.json được khởi tạo chuẩn xác
          npx tauri ios build --target aarch64 --ci || true

          # Tìm gói .app ARM64 vừa được tạo ra trong thư mục build hoặc xcarchive
          APP_PATH=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "*.app" | grep -iE "Release-iphoneos|ArchiveIntermediates|Products/Applications" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "*_iOS.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Could not find built .app!"
            find src-tauri/gen/apple -maxdepth 5
            exit 1
          fi

          echo "Found built ARM64 .app at: $APP_PATH"

          # Ký giả lập ad-hoc bằng ldid để cài qua Sideloadly / TrollStore không bị văng
          ldid -S "$APP_PATH"

          mkdir -p "$GITHUB_WORKSPACE/output-artifacts"

          # 1. Đóng gói file .app.zip
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          cd "$APP_DIR"
          zip -r9 "$GITHUB_WORKSPACE/output-artifacts/ProjectFood-ARM64.app.zip" "$APP_NAME"
          cd "$GITHUB_WORKSPACE"

          # 2. Đóng gói sẵn file .ipa chuẩn (Payload/*.app)
          mkdir -p "$GITHUB_WORKSPACE/output-artifacts/Payload"
          cp -r "$APP_PATH" "$GITHUB_WORKSPACE/output-artifacts/Payload/"
          cd "$GITHUB_WORKSPACE/output-artifacts"
          zip -r9 ProjectFood-ARM64-Unsigned.ipa Payload
          rm -rf Payload
          cd "$GITHUB_WORKSPACE"

          ls -lh "$GITHUB_WORKSPACE/output-artifacts/"

      - name: 12. Upload ARM64 .app & .ipa Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProjectFood-iOS-ARM64
          path: |
            output-artifacts/ProjectFood-ARM64.app.zip
            output-artifacts/ProjectFood-ARM64-Unsigned.ipa
          if-no-files-found: error
