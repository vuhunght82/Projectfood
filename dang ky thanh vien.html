<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thành Viên - Chay Hoa Sen</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4ee; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .auth-card { background: #fff; width: 100%; max-width: 380px; border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #234d20; text-align: center; margin-top: 0; }
    .form-group { margin-bottom: 14px; }
    label { font-size: 13px; font-weight: 600; color: #444; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    .btn { width: 100%; padding: 12px; background: #2e7d32; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
    .toggle-link { text-align: center; font-size: 13px; margin-top: 15px; color: #2e7d32; cursor: pointer; text-decoration: underline; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="auth-card">
  <h2>🪷 Chay Hoa Sen</h2>

  <!-- 1. FORM ĐĂNG NHẬP (Dùng hàng ngày) -->
  <div id="loginForm">
    <div class="form-group">
      <label>Số điện thoại</label>
      <input type="tel" id="loginPhone" placeholder="09xxxxxxxx">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="loginPass" placeholder="Nhập mật khẩu của bạn">
    </div>
    <button class="btn" onclick="handleLogin()">Đăng Nhập Tra Cứu</button>
    <div class="toggle-link" onclick="switchForm('register')">Chưa có tài khoản? Đăng ký nhận ưu đãi</div>
  </div>

  <!-- 2. FORM ĐĂNG KÝ BƯỚC 1: NHẬP THÔNG TIN -->
  <div id="registerForm" class="hidden">
    <div class="form-group">
      <label>Họ và tên</label>
      <input type="text" id="regName" placeholder="Nguyễn Văn A">
    </div>
    <div class="form-group">
      <label>Số điện thoại</label>
      <input type="tel" id="regPhone" placeholder="09xxxxxxxx">
    </div>
    <div class="form-group">
      <label>Mật khẩu (4-8 ký tự)</label>
      <input type="password" id="regPass" placeholder="Tạo mật khẩu dễ nhớ">
    </div>
    <button class="btn" onclick="handleRequestOtp()">Tiếp Tục & Nhận Mã OTP</button>
    <div class="toggle-link" onclick="switchForm('login')">Đã có tài khoản? Đăng nhập</div>
  </div>

  <!-- 3. FORM ĐĂNG KÝ BƯỚC 2: NHẬP OTP XÁC NHẬN -->
  <div id="otpForm" class="hidden">
    <p style="font-size: 14px; color: #555; text-align: center;">
      Mã xác thực đã gửi đến số <strong id="displayPhone"></strong>.<br>Vui lòng nhập mã để hoàn tất kích hoạt thẻ.
    </p>
    <div class="form-group">
      <label style="text-align: center;">Mã OTP (4 hoặc 6 số)</label>
      <input type="number" id="otpInput" placeholder="VD: 123456" style="text-align: center; letter-spacing: 5px; font-weight: bold; font-size: 18px;">
    </div>
    <button class="btn" onclick="handleVerifyOtp()">Xác Nhận & Mở Thẻ</button>
    <div class="toggle-link" onclick="switchForm('register')">Quay lại đổi số điện thoại</div>
  </div>
</div>

<script>
function switchForm(formName) {
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.add('hidden');
  document.getElementById('otpForm').classList.add('hidden');

  if (formName === 'login') document.getElementById('loginForm').classList.remove('hidden');
  if (formName === 'register') document.getElementById('registerForm').classList.remove('hidden');
  if (formName === 'otp') document.getElementById('otpForm').classList.remove('hidden');
}

// Xử lý gửi OTP
async function handleRequestOtp() {
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pass = document.getElementById('regPass').value.trim();

  if (!name || !phone || !pass) return alert("Vui lòng điền đủ thông tin!");

  // Gọi API backend: Kiểm tra SĐT đã tồn tại chưa, sinh OTP và gửi SMS
  /*
  const res = await fetch('/api/request-register-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone, name, password: pass })
  });
  */

  document.getElementById('displayPhone').innerText = phone;
  switchForm('otp');
}

// Xử lý xác nhận OTP
async function handleVerifyOtp() {
  const otp = document.getElementById('otpInput').value.trim();
  if (!otp) return alert("Vui lòng nhập mã OTP!");

  // Gọi API backend: So khớp OTP, nếu đúng -> ghi member vào Database
  /*
  const res = await fetch('/api/verify-and-create-member', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ otp })
  });
  */
  
  alert("Xác thực thành công! Thẻ thành viên Mầm Sen đã được kích hoạt.");
  // Lưu session và mở trực tiếp màn hình thẻ thành viên
}

// Xử lý Đăng nhập thông thường bằng Mật khẩu
async function handleLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  
  if (!phone || !pass) return alert("Vui lòng nhập SĐT và mật khẩu!");
  
  // So khớp với dữ liệu trong database
  console.log("Đăng nhập với:", phone);
}
</script>

</body>
</html>
