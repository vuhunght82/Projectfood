<div class="card">
    <div class="card-header">
        <h3 id="userFormTitle"><i class="fa-solid fa-user-plus"></i> Thêm Tài Khoản Mới</h3>
        <button class="btn btn-outline btn-sm" id="btnCancelEditUser" style="display: none;" onclick="resetUserForm()">
            <i class="fa-solid fa-xmark"></i> Hủy Sửa
        </button>
    </div>

    <!-- FORM THÊM / SỬA -->
    <form id="userForm" onsubmit="handleUserSubmit(event)" style="margin-bottom: 20px;">
        <input type="hidden" id="editUserId" value="">
        
        <div class="form-grid">
            <div class="form-group">
                <label>Tên Đăng Nhập (User_name) <span class="required">*</span>:</label>
                <input type="text" id="inputUserName" required placeholder="Nhập tên đăng nhập">
            </div>
            
            <div class="form-group">
                <label>Mật Khẩu (User_password) <span class="required">*</span>:</label>
                <input type="text" id="inputUserPassword" required placeholder="Nhập mật khẩu">
            </div>

            <div class="form-group">
                <label>Quyền Hạn (Role):</label>
                <select id="selectUserRole">
                    <option value="ADMIN">Quản Trị Viên (ADMIN)</option>
                    <option value="CASHIER">Thu Ngân (CASHIER)</option>
                    <option value="WAITER">Nhân Viên Phục Vụ (WAITER)</option>
                    <option value="KITCHEN">Bếp / Chế Biến (KITCHEN)</option>
                    <option value="CUSTOMER">Khách Hàng (CUSTOMER)</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btnSaveUser" style="margin-top: 10px;">
            <i class="fa-solid fa-floppy-disk"></i> Tạo Tài Khoản
        </button>
    </form>

    <div class="card-header">
        <h3><i class="fa-solid fa-users"></i> Danh Sách Tài Khoản</h3>
        <button class="btn btn-outline" onclick="loadUsers()"><i class="fa-solid fa-rotate"></i> Làm mới</button>
    </div>

    <!-- BẢNG DANH SÁCH -->
    <div class="overflow-x">
        <table>
            <thead>
                <tr>
                    <th>Tên Đăng Nhập</th>
                    <th>Mật Khẩu</th>
                    <th class="text-center">Quyền Hạn</th>
                    <th class="text-center">Thao Tác</th>
                </tr>
            </thead>
            <tbody id="usersListTable">
                <!-- Render từ JS -->
            </tbody>
        </table>
    </div>
</div>
