<div class="container-fluid py-3">
    <div class="row g-3">
        <!-- CỘT FORM THÊM / SỬA DANH MỤC -->
        <div class="col-lg-4 col-md-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-success text-white py-3 rounded-top-3 d-flex justify-content-between align-items-center">
                    <h5 class="m-0 fw-bold fs-6" id="categoryFormTitle">
                        <i class="fa-solid fa-folder-plus me-2"></i>Thêm Danh Mục Mới
                    </h5>
                    <button type="button" class="btn btn-sm btn-light d-none fw-bold" id="btnCancelCategoryEdit" onclick="cancelCategoryEdit()">Hủy</button>
                </div>
                <div class="card-body p-3">
                    <form id="categoryForm" onsubmit="handleCategorySubmit(event)">
                        <!-- Input ẩn lưu ID khi ở chế độ Sửa -->
                        <input type="hidden" id="categoryIdInput">

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" id="categoryNameInput" class="form-control form-control-sm" placeholder="VD: Lẩu Chay, Điểm Tâm..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Thứ tự hiển thị</label>
                            <input type="number" id="categoryOrderInput" class="form-control form-control-sm" value="1" min="1">
                        </div>

                        <button type="submit" id="btnSubmitCategory" class="btn btn-success w-100 fw-bold py-2 shadow-sm">
                            <i class="fa-solid fa-plus me-1"></i> Lưu Danh Mục
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- CỘT BẢNG DANH SÁCH DANH MỤC -->
        <div class="col-lg-8 col-md-7">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom-0">
                    <h5 class="m-0 text-success fw-bold fs-6">
                        <i class="fa-solid fa-list me-2"></i>Danh Sách Danh Mục
                    </h5>
                    <button class="btn btn-sm btn-outline-success rounded-pill px-3 fw-bold" onclick="loadCategories()">
                        <i class="fa-solid fa-rotate me-1"></i> Làm mới
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 table-responsive-mobile" id="categoriesTable">
                            <thead class="table-light text-secondary small">
                                <tr>
                                    <th class="text-center" style="width: 70px;">ID</th>
                                    <th>Tên Danh Mục</th>
                                    <th class="text-center" style="width: 110px;">Thứ Tự</th>
                                    <th class="text-center" style="width: 130px;">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody id="categoriesTableBody">
                                <tr>
                                    <td colspan="4" class="text-center py-4 text-muted">
                                        <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>
                                        Đang tải danh mục...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
