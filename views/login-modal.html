<!-- views/login-modal.html - Modal Đăng Nhập Hoàng Gia Hoa Sen (Nền xanh viền vàng đậm chuẩn mẫu) -->
<div id="loginModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:99999; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;">
    <div class="login-royal-card shadow-lg" style="background: radial-gradient(130% 130% at 50% 15%, #0e3d1c 0%, #06230f 65%, #031508 100%) !important; border: 2.5px solid #eab308 !important; border-radius: 28px !important; box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 35px rgba(234,179,8,0.3) !important; padding: 28px 24px !important; width: 100% !important; max-width: 410px !important; position: relative !important; color: #ffffff !important; overflow: hidden !important; box-sizing: border-box !important;">
        
        <!-- Nút đóng tròn viền vàng góc trên bên phải -->
        <button type="button" onclick="closeModal('loginModal')" title="Đóng" style="position: absolute !important; top: 16px !important; right: 16px !important; width: 34px !important; height: 34px !important; border-radius: 50% !important; border: 1.5px solid #d4af37 !important; background: rgba(0,0,0,0.3) !important; color: #ffd700 !important; display: flex !important; align-items: center !important; justify-content: center !important; cursor: pointer !important; font-size: 15px !important; padding: 0 !important; z-index: 10 !important; transition: transform 0.2s, background 0.2s;">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Huy hiệu Hoa Sen Vàng phát sáng ở đỉnh -->
        <div class="text-center mb-3">
            <div style="width: 70px !important; height: 70px !important; border-radius: 50% !important; border: 3px solid #eab308 !important; background: radial-gradient(circle, #0e441c 0%, #05220c 100%) !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; box-shadow: 0 0 25px rgba(234, 179, 8, 0.45) !important; margin-bottom: 12px !important;">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="#ffd700">
                    <path d="M12 2C12 2 8.5 7.5 8.5 12C8.5 14.5 10 16.5 12 16.5C14 16.5 15.5 14.5 15.5 12C15.5 7.5 12 2 12 2Z"/>
                    <path d="M5.5 9.5C5.5 9.5 6.5 15 10.5 16.5C9 15.5 8 13.8 7.8 11.5C7.6 9.5 8.2 7.8 8.2 7.8C8.2 7.8 6.2 8.2 5.5 9.5Z"/>
                    <path d="M18.5 9.5C18.5 9.5 17.5 15 13.5 16.5C15 15.5 16 13.8 16.2 11.5C16.4 9.5 15.8 7.8 15.8 7.8C15.8 7.8 17.8 8.2 18.5 9.5Z"/>
                </svg>
            </div>
            <div style="color: #ffd700 !important; font-size: 11.5px !important; font-weight: 700 !important; letter-spacing: 1.5px !important; text-transform: uppercase !important; margin-bottom: 2px !important;">
                NHÀ HÀNG CHAY HOA SEN
            </div>
            <h4 style="color: #ffffff !important; font-weight: 800 !important; font-size: 22px !important; margin: 0 0 4px 0 !important; letter-spacing: 0.3px !important;">
                Đăng Nhập Hệ Thống
            </h4>
            <div style="color: #a7f3d0 !important; font-size: 12.5px !important; font-weight: 500 !important;">
                Quản lý bán hàng, gọi món & phục vụ POS
            </div>
        </div>

        <!-- Form Đăng Nhập -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- Tên tài khoản -->
            <div style="margin-bottom: 14px !important;">
                <label style="display: flex !important; align-items: center !important; gap: 6px !important; font-size: 13px !important; font-weight: 700 !important; color: #ffd700 !important; margin-bottom: 6px !important;">
                    <i class="fa-solid fa-user-tag text-warning"></i> Tên tài khoản / Mã nhân viên:
                </label>
                <div style="background: #041a0b !important; border: 1.5px solid #165b2a !important; border-radius: 14px !important; padding: 6px 14px !important; display: flex !important; align-items: center !important; gap: 10px !important;">
                    <i class="fa-solid fa-id-badge" style="color: #f59e0b !important; font-size: 18px !important;"></i>
                    <input type="text" id="loginUsername" required placeholder="Nhập tên tài khoản..." autocomplete="username" style="background: transparent !important; border: none !important; outline: none !important; color: #ffffff !important; width: 100% !important; font-size: 14px !important; padding: 6px 0 !important; font-weight: 500 !important;">
                </div>
            </div>

            <!-- Mật khẩu -->
            <div style="margin-bottom: 12px !important;">
                <label style="display: flex !important; align-items: center !important; gap: 6px !important; font-size: 13px !important; font-weight: 700 !important; color: #ffd700 !important; margin-bottom: 6px !important;">
                    <i class="fa-solid fa-shield-halved text-warning"></i> Mật khẩu bảo mật:
                </label>
                <div style="background: #041a0b !important; border: 1.5px solid #165b2a !important; border-radius: 14px !important; padding: 6px 14px !important; display: flex !important; align-items: center !important; gap: 10px !important;">
                    <i class="fa-solid fa-lock" style="color: #f59e0b !important; font-size: 18px !important;"></i>
                    <input type="password" id="loginPassword" required placeholder="Nhập mật khẩu..." autocomplete="current-password" style="background: transparent !important; border: none !important; outline: none !important; color: #ffffff !important; width: 100% !important; font-size: 14px !important; padding: 6px 0 !important; font-weight: 500 !important;">
                    <button type="button" onclick="window.toggleLoginPasswordVisibility()" style="background: transparent !important; border: none !important; color: #4ade80 !important; cursor: pointer !important; padding: 0 !important; font-size: 15px !important;" title="Hiện / Ẩn mật khẩu">
                        <i class="fa-solid fa-eye" id="loginPwEyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Ghi nhớ đăng nhập / Nhớ mật khẩu & Tên đăng nhập -->
            <div style="margin-bottom: 18px !important; display: flex !important; align-items: center !important; justify-content: space-between !important;">
                <label style="display: flex !important; align-items: center !important; gap: 8px !important; color: #d1fae5 !important; font-size: 13px !important; cursor: pointer !important; user-select: none !important; margin: 0 !important;">
                    <input type="checkbox" id="loginRememberMe" style="width: 17px !important; height: 17px !important; accent-color: #f59e0b !important; cursor: pointer !important; margin: 0 !important;">
                    <span>Nhớ mật khẩu & tên đăng nhập</span>
                </label>
            </div>

            <!-- Nút Đăng Nhập Vàng Cam Sang Trọng -->
            <button type="submit" style="background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%) !important; color: #1c1100 !important; border: none !important; border-radius: 16px !important; font-size: 15.5px !important; font-weight: 800 !important; letter-spacing: 0.5px !important; box-shadow: 0 8px 24px rgba(217, 119, 6, 0.45) !important; cursor: pointer !important; width: 100% !important; padding: 12px 16px !important; display: flex !important; align-items: center !important; justify-content: center !important; gap: 8px !important; transition: transform 0.2s, box-shadow 0.2s !important;">
                <i class="fa-solid fa-right-to-bracket fs-6"></i> ĐĂNG NHẬP HỆ THỐNG
            </button>
        </form>

        <!-- Các nhãn phân quyền bên dưới -->
        <div style="border-top: 1px dashed rgba(212, 175, 55, 0.25) !important; margin: 18px 0 14px 0 !important;"></div>
        <div style="display: flex !important; justify-content: center !important; gap: 8px !important; flex-wrap: wrap !important; margin-bottom: 14px !important;">
            <span style="background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(212,175,55,0.4) !important; border-radius: 20px !important; padding: 4px 10px !important; font-size: 11.5px !important; color: #fef08a !important; display: inline-flex !important; align-items: center !important;">
                <i class="fa-solid fa-crown text-warning me-1"></i> Quản Lý
            </span>
            <span style="background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(212,175,55,0.4) !important; border-radius: 20px !important; padding: 4px 10px !important; font-size: 11.5px !important; color: #fef08a !important; display: inline-flex !important; align-items: center !important;">
                <i class="fa-solid fa-cash-register text-warning me-1"></i> Thu Ngân
            </span>
            <span style="background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(212,175,55,0.4) !important; border-radius: 20px !important; padding: 4px 10px !important; font-size: 11.5px !important; color: #fef08a !important; display: inline-flex !important; align-items: center !important;">
                <i class="fa-solid fa-utensils text-warning me-1"></i> Bồi Bàn
            </span>
            <span style="background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(212,175,55,0.4) !important; border-radius: 20px !important; padding: 4px 10px !important; font-size: 11.5px !important; color: #fef08a !important; display: inline-flex !important; align-items: center !important;">
                <i class="fa-solid fa-fire-burner text-warning me-1"></i> Bếp
            </span>
        </div>

        <!-- Châm ngôn dưới đáy -->
        <div style="text-align: center !important; color: #6ee7b7 !important; font-size: 11px !important; font-style: italic !important; opacity: 0.85 !important;">
            🌱 Ẩm Thực Chay Thuần Khiết • Phục Vụ Tận Tâm • An Lạc
        </div>
    </div>
</div>
